name: Update news

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the fetch & summarize script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_summarize.py

      - name: Commit and push updated news.json
        run: |
          git config user.name "supply-line-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --quiet --cached || git commit -m "Update news data"
          git push
